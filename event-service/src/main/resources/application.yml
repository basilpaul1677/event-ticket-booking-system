spring:
  application:
    name: event-service

  datasource:
    url: jdbc:mysql://localhost:3306/event_booking_event_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:event_booking_app}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value-123456789}
  expiration: ${JWT_EXPIRATION:86400000}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8081}