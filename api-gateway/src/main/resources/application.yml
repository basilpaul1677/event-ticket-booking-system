spring:
  application:
    name: api-gateway

  cloud:
    # We are not using a Config Server yet
    config:
      enabled: false

    gateway:
      routes:

        # ==============================
        # USER SERVICE
        # Port: 8081
        # ==============================
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**,/api/v1/auth/**

        # ==============================
        # ADMIN - EVENT CENTER
        # User Service
        # Port: 8081
        # ==============================
        - id: admin-event-center-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/admin/event-centers/**

        # ==============================
        # EVENT SERVICE
        # Port: 8082
        # ==============================
        - id: event-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/events/**,/api/v1/event-centers/**

        # ==============================
        # ADMIN - EVENTS
        # Event Service
        # Port: 8082
        # ==============================
        - id: admin-event-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/admin/events/**

        # ==============================
        # BOOKING SERVICE
        # Port: 8083
        # ==============================
        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/bookings/**

        # ==============================
        # NOTIFICATION SERVICE
        # Port: 8084
        # ==============================
        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/notifications/**


# ==========================================
# API GATEWAY SERVER
# ==========================================
server:
  port: 8080


# ==========================================
# ACTUATOR
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    health:
      show-details: always